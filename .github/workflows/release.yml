name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish from its v-prefixed tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: vars.NPM_PUBLISH_ENABLED == 'true' && github.event.repository.private == false
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json')); if (p.version !== process.env.RELEASE_VERSION) process.exit(1)"
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - run: npm pack --dry-run
      - run: npm publish --access public
