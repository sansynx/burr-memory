<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 280"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">From failure to reusable fix</title>
  <desc id="desc">
    Search previous fixes. Capture useful failure evidence. Verify with your
    actual tests. Save a playbook.
  </desc>
  <rect width="100%" height="100%" fill="#000000" />
  <defs>
    <marker
      id="arrow"
      markerWidth="8"
      markerHeight="8"
      refX="7"
      refY="4"
      orient="auto"
    >
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#b0b0b8" />
    </marker>
  </defs>
  <g font-family="Arial, sans-serif" fill="#ffffff">
    <line x1="0" y1="32" x2="256" y2="32" stroke="#3a3a3f" />
    <text x="0" y="68" font-size="12" fill="#b0b0b8">01</text>
    <text x="0" y="124" font-size="28" letter-spacing="1">SEARCH</text>
    <text x="0" y="160" font-size="16" fill="#d0d0d5">
      Find a relevant fix.
    </text>
    <path d="M260 120 H284" stroke="#b0b0b8" marker-end="url(#arrow)" />
    <line x1="304" y1="32" x2="560" y2="32" stroke="#3a3a3f" />
    <text x="304" y="68" font-size="12" fill="#b0b0b8">02</text>
    <text x="304" y="124" font-size="28" letter-spacing="1">CAPTURE</text>
    <text x="304" y="160" font-size="16" fill="#d0d0d5">
      Keep the failure evidence.
    </text>
    <path d="M564 120 H588" stroke="#b0b0b8" marker-end="url(#arrow)" />
    <line x1="608" y1="32" x2="864" y2="32" stroke="#3a3a3f" />
    <text x="608" y="68" font-size="12" fill="#b0b0b8">03</text>
    <text x="608" y="124" font-size="28" letter-spacing="1">VERIFY</text>
    <text x="608" y="160" font-size="16" fill="#d0d0d5">
      Run your real checks.
    </text>
    <path d="M868 120 H892" stroke="#b0b0b8" marker-end="url(#arrow)" />
    <line x1="912" y1="32" x2="1168" y2="32" stroke="#3a3a3f" />
    <text x="912" y="68" font-size="12" fill="#b0b0b8">04</text>
    <text x="912" y="124" font-size="28" letter-spacing="1">SAVE</text>
    <text x="912" y="160" font-size="16" fill="#d0d0d5">
      Write a reusable playbook.
    </text>
  </g>
</svg>
