<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 620"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Burr shared local memory architecture</title>
  <desc id="desc">
    Skills and CLI search and save Markdown signals and playbooks. The loaded
    host adapter and runtime retrieve and learn from JSON lessons. Both stores
    belong to shared memory on this machine. Runtime playbooks export to
    Markdown. The runtime separately records run history. Project .burr stores
    configuration and usage.
  </desc>
  <defs>
    <marker
      id="arrow"
      markerWidth="10"
      markerHeight="10"
      refX="8"
      refY="5"
      orient="auto-start-reverse"
      markerUnits="userSpaceOnUse"
    >
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#ffffff" stroke-width="2" />
    </marker>
  </defs>
  <rect width="760" height="620" fill="#000000" />
  <g font-family="Arial, sans-serif" fill="#ffffff">
    <rect
      x="20"
      y="204"
      width="680"
      height="240"
      rx="8"
      fill="#0a0a0a"
      stroke="#888888"
    />
    <text x="208" y="234" font-size="22" font-weight="700">
      Shared local memory
    </text>
    <text x="208" y="258" font-size="16" fill="#d0d0d5">~/.burr/memory/</text>
    <path
      d="M160 112 V284"
      fill="none"
      stroke="#ffffff"
      stroke-width="2"
      marker-start="url(#arrow)"
      marker-end="url(#arrow)"
    />
    <path
      d="M548 112 V284"
      fill="none"
      stroke="#ffffff"
      stroke-width="2"
      marker-start="url(#arrow)"
      marker-end="url(#arrow)"
    />
    <path
      d="M700 68 H720 Q728 68 728 76 V476 Q728 484 720 484 H568 Q560 484 560 492 V512"
      fill="none"
      stroke="#ffffff"
      stroke-width="2"
      marker-end="url(#arrow)"
    />
    <path
      d="M416 340 H372 Q364 340 364 348 V400 Q364 408 356 408 H188 Q180 408 180 400 V372"
      fill="none"
      stroke="#ffffff"
      stroke-width="2"
      marker-end="url(#arrow)"
    />
    <rect
      x="20"
      y="24"
      width="280"
      height="88"
      rx="6"
      fill="#141414"
      stroke="#888888"
    />
    <text x="40" y="60" font-size="22" font-weight="700">Skills + CLI</text>
    <text x="40" y="88" font-size="17" fill="#d0d0d5">
      Commands your agent calls
    </text>
    <rect
      x="420"
      y="24"
      width="280"
      height="88"
      rx="6"
      fill="#141414"
      stroke="#888888"
    />
    <text x="440" y="60" font-size="22" font-weight="700">
      Host adapter + runtime
    </text>
    <text x="440" y="88" font-size="17" fill="#d0d0d5">
      Loaded in a supported agent
    </text>
    <rect x="184" y="146" width="140" height="28" fill="#000000" />
    <text x="188" y="166" font-size="16">Search / save</text>
    <rect x="566" y="146" width="142" height="28" fill="#000000" />
    <text x="572" y="166" font-size="16">Retrieve / learn</text>
    <rect
      x="44"
      y="284"
      width="268"
      height="88"
      rx="4"
      fill="#141414"
      stroke="#ffffff"
    />
    <text x="64" y="320" font-size="22" font-weight="700">Markdown memory</text>
    <text x="64" y="348" font-size="17" fill="#d0d0d5">
