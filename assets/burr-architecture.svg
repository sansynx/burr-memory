<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title description">
  <title id="title">Burr architecture</title>
  <desc id="description">A coding agent uses skills and the CLI, or a supported runtime adapter. Both use shared local memory. The runtime also records local tool history. Project configuration and usage stay in the project's .burr directory.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="#666b65" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="640" height="420" rx="12" fill="#fbfaf7"/>
  <g fill="none" stroke="#666b65" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M320 84 V108 H162 V134"/>
    <path d="M320 108 H478 V134"/>
    <path d="M162 214 V284" marker-start="url(#arrow)"/>
    <path d="M478 214 V284"/>
    <path d="M358 174 H320 V324 H282" marker-start="url(#arrow)"/>
  </g>
  <g fill="#ffffff" stroke="#d8d5ce" stroke-width="1.5">
    <rect x="200" y="28" width="240" height="56" rx="8"/>
    <rect x="42" y="134" width="240" height="80" rx="8"/>
    <rect x="358" y="134" width="240" height="80" rx="8"/>
    <rect x="42" y="284" width="240" height="80" rx="8"/>
    <rect x="358" y="284" width="240" height="80" rx="8"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#242923">
    <text x="320" y="63" font-size="22" font-weight="600">Coding agent</text>
    <text x="162" y="167" font-size="21" font-weight="600">Skills + CLI</text>
    <text x="162" y="193" font-size="17" fill="#666b65">Search, capture, resolve</text>
    <text x="478" y="167" font-size="21" font-weight="600">Host adapter + runtime</text>
    <text x="478" y="193" font-size="17" fill="#666b65">Tool checks and outcomes</text>
    <text x="162" y="317" font-size="21" font-weight="600">Shared local memory</text>
    <text x="162" y="344" font-size="17" fill="#ac3c17">~/.burr/memory/</text>
    <text x="478" y="317" font-size="21" font-weight="600">Local run history</text>
    <text x="478" y="344" font-size="17" fill="#666b65">~/.burr/runs/</text>
    <text x="320" y="400" font-size="17" fill="#666b65">Project .burr/: configuration and usage · No hosted memory</text>
  </g>
</svg>
