    />
    <text x="440" y="548" font-size="22" font-weight="700">
      Local run history
    </text>
    <text x="440" y="576" font-size="17" fill="#d0d0d5">~/.burr/runs/</text>
    <text x="20" y="548" font-size="20" font-weight="700">Project .burr/</text>
