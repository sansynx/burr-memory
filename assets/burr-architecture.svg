<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 720 620"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Burr local architecture</title>
  <desc id="desc">
    Skills and CLI read and write Markdown memory. Supported host adapters and
    runtime use structured lessons and record local run history. Project
    configuration and usage remain in the project. No hosted memory.
  </desc>
  <rect width="100%" height="100%" fill="#000000" />
  <defs>
    <marker
      id="arrow"
      markerWidth="8"
      markerHeight="8"
      refX="7"
      refY="4"
      orient="auto"
    >
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#b0b0b8" />
    </marker>
  </defs>
  <g font-family="Arial, sans-serif" fill="#ffffff">
    <text x="32" y="32" font-size="12" letter-spacing="2" fill="#b0b0b8">
      YOUR MACHINE / TWO RETRIEVAL PATHS
    </text>
    <path
      d="M184 164 V244 M536 164 V244"
      fill="none"
      stroke="#b0b0b8"
      marker-end="url(#arrow)"
    />
    <rect
      x="32"
      y="76"
      width="304"
      height="88"
      fill="#0a0a0a"
      stroke="#727277"
    />
    <rect
      x="384"
      y="76"
      width="304"
      height="88"
      fill="#0a0a0a"
      stroke="#727277"
    />
    <text x="56" y="112" font-size="22">SKILLS + CLI</text>
    <text x="56" y="140" font-size="16" fill="#d0d0d5">
      Agent-invoked commands
    </text>
    <text x="408" y="112" font-size="22">HOST + RUNTIME</text>
    <text x="408" y="140" font-size="16" fill="#d0d0d5">
      Checks and tool outcomes
    </text>
    <text x="200" y="208" font-size="14" fill="#d0d0d5">Search / save</text>
    <text x="552" y="208" font-size="14" fill="#d0d0d5">Retrieve / learn</text>
    <rect
      x="32"
      y="244"
      width="304"
      height="112"
      fill="#0a0a0a"
      stroke="#ffffff"
    />
    <rect
      x="384"
      y="244"
      width="304"
      height="112"
      fill="#0a0a0a"
      stroke="#ffffff"
    />
    <text x="56" y="280" font-size="22">MARKDOWN MEMORY</text>
    <text x="56" y="312" font-size="16" fill="#d0d0d5">
      Signals + verified playbooks
    </text>
    <text x="56" y="336" font-size="14" fill="#b0b0b8">~/.burr/memory/</text>
    <text x="408" y="280" font-size="22">RUNTIME LESSONS</text>
    <text x="408" y="312" font-size="16" fill="#d0d0d5">
      Structured JSON knowledge
    </text>
    <text x="408" y="336" font-size="14" fill="#b0b0b8">
      ~/.burr/memory/knowledge/
    </text>
    <text x="32" y="416" font-size="15" fill="#d0d0d5">
      Verified runtime playbooks also
    </text>
    <text x="32" y="440" font-size="15" fill="#d0d0d5">
      export to Markdown memory.
    </text>
    <rect
      x="384"
      y="412"
      width="304"
      height="80"
      fill="#0a0a0a"
      stroke="#3a3a3f"
    />
    <text x="408" y="444" font-size="20">LOCAL RUN HISTORY</text>
    <text x="408" y="472" font-size="14" fill="#b0b0b8">~/.burr/runs/</text>
    <line x1="32" y1="536" x2="688" y2="536" stroke="#3a3a3f" />
    <text x="32" y="568" font-size="16">PROJECT .burr/</text>
    <text x="32" y="596" font-size="15" fill="#d0d0d5">
      Configuration, usage, and generated host copies. No cloud sync.
    </text>
  </g>
</svg>
